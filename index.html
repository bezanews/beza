
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070707">
<title>BEZA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
 background:#070707;color:#f2f2f2;
 font-family:Inter,Arial,sans-serif;
 overflow-x:hidden;
}
body:before{
 content:"";position:fixed;inset:0;z-index:-1;
 background:
 radial-gradient(ellipse at 50% 10%,#ffffff0d,transparent 48%),
 radial-gradient(ellipse at 85% 80%,#ffffff08,transparent 38%);
}
.wrap{width:min(1040px,calc(100% - 44px));margin:auto}
header{
 height:78px;display:flex;align-items:center;
 justify-content:space-between;
 border-bottom:1px solid #ffffff1c;
}
.wordmark{font-size:13px;font-weight:850;letter-spacing:5px}
.header-note,.eyebrow,.section-index,.meta{
 font:10px monospace;letter-spacing:2px;color:#777;
}
.hero{
 min-height:calc(100svh - 78px);
 display:grid;place-items:center;
 text-align:center;padding:70px 0 100px;
}
.hero-inner{display:flex;align-items:center;flex-direction:column}
.avatar{
 width:clamp(150px,25vw,220px);
 aspect-ratio:1;border-radius:50%;
 object-fit:cover;
 border:1px solid #ffffff40;
 box-shadow:0 0 70px #ffffff12;
 margin-bottom:34px;
}
h1{
 font-size:clamp(64px,13vw,132px);
 line-height:.9;letter-spacing:-.085em;
 font-weight:850;
}
h1 span{color:#666}
.hero-sub{margin-top:22px;color:#999;font-size:14px}
.hero-line{
 width:1px;height:65px;
 background:linear-gradient(transparent,#777,transparent);
 margin-top:52px;
}
section{padding:70px 0;border-top:1px solid #ffffff1c}
.section-head{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:28px;
}
h2{font-size:11px;letter-spacing:3px;font-weight:650}
.about{
 max-width:550px;color:#aaa;
 font-size:clamp(16px,2vw,19px);line-height:1.85;
}
.panel{
 border:1px solid #ffffff1c;
 background:linear-gradient(135deg,#ffffff09,#ffffff02);
 padding:28px;display:flex;
 align-items:center;justify-content:space-between;gap:20px;
}
.panel-title{font-size:clamp(22px,4vw,32px);letter-spacing:-1px}
.panel-note{margin-top:8px;color:#777;font-size:12px}
footer{
 border-top:1px solid #ffffff1c;
 padding:26px 0 34px;display:flex;
 justify-content:space-between;color:#666;
 font:10px monospace;letter-spacing:2px;
}
.reveal{
 opacity:0;transform:translateY(18px);
 transition:opacity .85s ease,transform .85s ease;
}
.reveal.visible{opacity:1;transform:translateY(0)}
@media(max-width:600px){
 .wrap{width:calc(100% - 34px)}
 .hero{min-height:88svh}
 section{padding:54px 0}
 .panel{padding:22px}
 footer{gap:12px;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 .reveal{opacity:1;transform:none;transition:none}
}
</style>
</head>
<body>
<div class="wrap">

<header>
 <div class="wordmark">BEZA</div>
 <div class="header-note">PERSONAL SPACE</div>
</header>

<main>
<section class="hero" style="border:0">
 <div class="hero-inner">
  <img class="avatar reveal"
       src="avatar.png"
       alt="BEZA monochrome profile image">
  <div class="eyebrow reveal">WELCOME TO MY SPACE</div>
  <h1 class="reveal">BEZA<span>.</span></h1>
  <p class="hero-sub reveal">A personal space on the internet.</p>
  <div class="hero-line reveal"></div>
 </div>
</section>

<section>
 <div class="section-head reveal">
  <h2>ABOUT</h2>
  <span class="section-index">01</span>
 </div>
 <p class="about reveal">
  Minimal by design. A place for my projects,
  ideas and whatever comes next.
 </p>
</section>

<section>
 <div class="section-head reveal">
  <h2>PROJECTS</h2>
  <span class="section-index">02</span>
 </div>
 <div class="panel reveal">
  <div>
   <div class="panel-title">Personal space</div>
   <div class="panel-note">More coming soon.</div>
  </div>
  <div class="meta">IN PROGRESS</div>
 </div>
</section>
</main>

<footer>
 <span>© 2026 BEZA</span>
 <span>KEEP IT SIMPLE.</span>
</footer>

</div>

<script>
const observer=new IntersectionObserver(entries=>{
 entries.forEach(entry=>{
  if(entry.isIntersecting){
   entry.target.classList.add("visible");
   observer.unobserve(entry.target);
  }
 });
},{threshold:.12});

document.querySelectorAll(".reveal").forEach(el=>{
 observer.observe(el);
});
</script>
</body>
</html>
