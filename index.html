
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>beza</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: #f4f4f4;
  font-family: Inter, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .12;
  background-image: radial-gradient(#777 0.6px, transparent 0.6px);
  background-size: 5px 5px;
}

nav {
  display: flex;
  align-items: center;
  padding: 28px 8%;
  border-bottom: 1px solid #222;
  position: relative;
}

.logo {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 5px;
}

main {
  max-width: 1050px;
  margin: auto;
  padding: 120px 8% 80px;
  position: relative;
  animation: appear 1s ease both;
}

.eyebrow {
  color: #777;
  font-size: 11px;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(75px, 17vw, 165px);
  letter-spacing: -12px;
  line-height: .9;
  font-weight: 800;
}

h1 span {
  color: #555;
}

.description {
  color: #999;
  font-size: 14px;
  line-height: 1.8;
  max-width: 390px;
  margin-top: 35px;
}

.line {
  height: 1px;
  background: #222;
  margin: 75px 0 35px;
}

.section-title {
  color: #777;
  font-size: 10px;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

.links {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.link {
  border: 1px solid #222;
  padding: 22px;
  color: white;
  text-decoration: none;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  transition: .3s ease;
}

.link:hover {
  background: #151515;
  border-color: #555;
  transform: translateY(-3px);
}

.link span:last-child {
  color: #666;
}

footer {
  border-top: 1px solid #222;
  padding: 25px 8%;
  display: flex;
  justify-content: space-between;
  color: #666;
  font-size: 10px;
  letter-spacing: 2px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media(max-width: 600px) {
  main {
    padding-top: 100px;
  }

  h1 {
    letter-spacing: -7px;
  }

  .links {
    grid-template-columns: 1fr;
  }

  footer {
    gap: 15px;
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">beza</div>
</nav>

<main>
  <div class="eyebrow">WELCOME</div>

  <h1>beza<span>.</span></h1>

  <p class="description">
    A personal space on the internet.
    Nothing more, nothing less.
  </p>

  <div class="line"></div>

  <div class="section-title">CONNECT</div>

  <div class="links">
    <a class="link" href="#" target="_blank">
      Instagram <span>↗</span>
    </a>

    <a class="link" href="#" target="_blank">
      Discord <span>↗</span>
    </a>

    <a class="link" href="#" target="_blank">
      YouTube <span>↗</span>
    </a>

    <a class="link" href="#" target="_blank">
      Contact <span>↗</span>
    </a>
  </div>
</main>

<footer>
  <span>© 2026 beza</span>
  <span>PERSONAL WEBSITE</span>
</footer>

</body>
</html>
